name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q
      - name: Fixture is reproducible from the real policy documents
        run: python tests/build_fixture.py && git diff --exit-code tests/fixtures/account_gaad.json
        shell: bash

  action:
    name: composite action (end-to-end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit the GAAD fixture via the action
        uses: ./
        with:
          gaad: tests/fixtures/account_gaad.json
          format: json
          fail-on: none
      - name: Policy check via the action
        uses: ./
        with:
          policy: tests/fixtures/toolkit_policy_current.json
          trust: tests/fixtures/toolkit_trust_policy.json
          fail-on: none
